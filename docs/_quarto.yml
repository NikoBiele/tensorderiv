# Quarto configuration of the tensorderiv documentation website (https://tensorderiv.org).
# Render locally from the repository root with:  quarto render docs
project:
  type: website
  output-dir: _site                  # the built site; never committed, published by CI

website:
  title: "tensorderiv"
  description: "Gradient, divergence, curl and Laplacian on scattered points, with a Rust core"
  site-url: https://tensorderiv.org
  repo-url: https://github.com/NikoBiele/tensorderiv
  repo-subdir: docs                  # "edit this page" links point into docs/
  repo-actions: [edit, issue]        # links under each page's table of contents
  search: true
  favicon: assets/logo.svg           # the icon in the browser tab
  navbar:
    logo: assets/logo.svg            # a stencil in a point cloud, next to the site title
    logo-alt: "tensorderiv logo: a stencil in a scattered point cloud"
    right:
      - icon: github
        href: https://github.com/NikoBiele/tensorderiv
        aria-label: GitHub repository
  sidebar:
    style: floating                  # always visible on wide screens, as on convinterp.org
    contents:
      - href: index.qmd
        text: Home
      - href: guide.qmd
        text: User guide
      - href: accuracy.qmd
        text: Accuracy and performance
      - href: theory.qmd
        text: Theory
      - href: about.qmd
        text: About
  page-footer:
    left: "© 2026 Nikolaj Maack Bielefeld · MIT license"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme: cosmo                     # the same theme as convinterp.org and gert.net
    toc: true                        # a table of contents on every page
    html-math-method: katex          # fast math rendering, as on convinterp.org
    code-copy: true                  # a copy button on every code block
    code-overflow: wrap
    grid:
      body-width: 950px              # a wider content column for figures (Quarto's default is 800px)

jupyter: python3                     # code cells run in Python, against the tensorderiv built from this repository

execute:
  echo: true                         # show the code next to its output
  warning: false                     # keep library warnings out of the pages