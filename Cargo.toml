# The Rust package. Cargo is Rust's build tool and package manager, like Julia's Pkg.
[package]
name = "tensorderiv"
version = "0.1.0"
edition = "2021"                  # the Rust language edition (a stable set of language rules)
description = "Rust core of tensorderiv: gradient, divergence, curl and Laplacian on scattered points"
license = "MIT"
repository = "https://github.com/NikoBiele/tensorderiv"

[lib]
name = "_core"                    # the compiled module; Python imports it as tensorderiv._core
crate-type = ["cdylib"]           # build a shared library that Python can load

[dependencies]
pyo3 = "0.29"                     # Rust ↔ Python bindings
numpy = "0.29"                    # NumPy arrays in Rust (must match the PyO3 version)
rayon = "1.12"                    # data parallelism: spreads loops over all cores, like Julia's threaded tasks

# Release builds (maturin develop --release, and the published wheels)
[profile.release]
lto = true                        # link-time optimization: optimize across crates (pyo3, numpy, rayon)
codegen-units = 1                 # compile as one unit, so the optimizer sees the whole crate at once